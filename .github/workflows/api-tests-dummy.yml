name: API Tests

on:
  workflow_dispatch:
    inputs:
      suite:
        description: "Test suite to run"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - smoke
          - regression
          - negative

      workers:
        description: "xdist workers count"
        required: true
        default: "2"
        type: choice
        options:
          - auto
          - "2"
          - "3"
          - "4"

jobs:
  run-tests:
    name: Run API tests
    runs-on: ubuntu-latest

    # Права нужны для публикации Allure-отчёта на GitHub Pages
    # и сохранения истории отчётов в отдельную ветку
    permissions:
      contents: write
      pages: write
      id-token: write

    # Секреты передаются в контейнер как переменные окружения
    env:
      BASE_URL: ${{ secrets.BASE_URL }}
      API_TOKEN: ${{ secrets.API_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Собираем Docker-образ перед запуском тестов
      - name: Build Docker image
        run: docker compose build

      # Запускаем выбранный suite и не останавливаем workflow сразу при падении тестов,
      # чтобы успеть сохранить логи и сгенерировать Allure-отчёт
      - name: Run selected test suite
        id: tests
        continue-on-error: true
        run: docker compose run --rm -e PYTEST_WORKERS=${{ github.event.inputs.workers }} ${{ github.event.inputs.suite }}

      # После Docker файлы могут принадлежать root, поэтому меняем владельца
      - name: Fix artifact permissions
        if: always()
        run: sudo chown -R $USER:$USER allure-results logs || true

      # Загружаем pytest-логи как artifact, чтобы их можно было скачать из GitHub Actions
      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: logs/
          if-no-files-found: warn
          retention-days: 14

      # Java нужна для работы Allure CLI
      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Кэшируем Allure CLI, чтобы не скачивать его при каждом запуске
      - name: Cache Allure CLI
        uses: actions/cache@v4
        with:
          path: /opt/allure
          key: allure-2.27.0

      - name: Install Allure CLI
        run: |
          if [ ! -x /opt/allure/bin/allure ]; then
            ALLURE_VERSION=2.27.0
            curl -L -o allure.tgz https://github.com/allure-framework/allure2/releases/download/${ALLURE_VERSION}/allure-${ALLURE_VERSION}.tgz
            tar -xzf allure.tgz
            sudo mv allure-${ALLURE_VERSION} /opt/allure
          fi

          sudo ln -sf /opt/allure/bin/allure /usr/bin/allure
          allure --version

      # Получаем ветку с предыдущей Allure history, если она уже существует
      - name: Fetch Allure history branch
        run: git fetch --depth=1 origin allure-history:allure-history || true

      # Подкладываем старую history в allure-results,
      # чтобы новый отчёт продолжал тренды прошлых запусков
      - name: Restore Allure history
        run: |
          if git show-ref --verify --quiet refs/heads/allure-history; then
            git checkout allure-history -- history || true

            if [ -d "history" ]; then
              mkdir -p allure-results/history
              cp -r history/* allure-results/history/ || true
            fi

            git checkout -- .
          fi

      # Генерируем HTML-отчёт Allure даже если тесты упали
      - name: Generate Allure report
        if: always()
        run: allure generate allure-results -o allure-report --clean

      # Готовим публикацию Allure-отчёта на GitHub Pages
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v4

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: allure-report

      - name: Deploy Allure report to GitHub Pages
        uses: actions/deploy-pages@v4

      # Сохраняем новую Allure history в отдельную ветку для следующих запусков
      - name: Persist Allure history
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git checkout --orphan tmp-history
          git rm -rf . >/dev/null 2>&1 || true

          mkdir history
          cp -r allure-report/history/* history/ || true

          git add history
          git commit -m "Update Allure history" || true
          git branch -M allure-history
          git push -f origin allure-history

      # В конце возвращаем workflow в failed-статус, если тесты реально упали
      - name: Fail workflow if tests failed
        if: steps.tests.outcome == 'failure'
        run: exit 1