name: API Tests

on:
  workflow_dispatch:
    inputs:
      suite:
        description: "Test suite to run"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - smoke
          - regression
          - negative

      workers:
        description: "xdist workers count"
        required: true
        default: "2"
        type: choice
        options:
          - auto
          - "2"
          - "3"
          - "4"

jobs:
  run-tests:
    name: Run API tests
    runs-on: ubuntu-latest

    # Права нужны для публикации Allure-отчёта на GitHub Pages
    # и сохранения истории отчётов в отдельную ветку allure-history.
    permissions:
      contents: write
      pages: write
      id-token: write

    # Секреты из GitHub Secrets передаются в workflow как переменные окружения.
    env:
      BASE_URL: ${{ secrets.BASE_URL }}
      API_TOKEN: ${{ secrets.API_TOKEN }}

    steps:
      # Скачивает код репозитория внутрь GitHub Actions runner.
      - name: Checkout repository
        uses: actions/checkout@v4

      # Собирает Docker-образ по Dockerfile и docker-compose.yml.
      - name: Build Docker image
        run: docker compose build

      # Запускает выбранный test suite: all, smoke, regression или negative.
      # continue-on-error нужен, чтобы workflow не остановился сразу после падения тестов,
      # а успел сохранить логи и сгенерировать Allure-отчёт.
      - name: Run selected test suite
        id: tests
        continue-on-error: true
        run: docker compose run --rm -e PYTEST_WORKERS=${{ github.event.inputs.workers }} ${{ github.event.inputs.suite }}

      # Исправляет права на файлы, созданные внутри Docker-контейнера.
      # Без этого GitHub Actions может не иметь доступа к allure-results и logs.
      - name: Fix artifact permissions
        if: always()
        run: sudo chown -R $USER:$USER allure-results logs || true

      # Загружает pytest-логи как artifact.
      # Их можно скачать из GitHub Actions после завершения workflow.
      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: logs/
          if-no-files-found: warn
          retention-days: 14

      # Устанавливает Java, потому что Allure CLI работает через Java.
      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Кэширует Allure CLI в /opt/allure.
      # Если кэш найден, Allure не придётся скачивать заново при каждом запуске.
      - name: Cache Allure CLI
        uses: actions/cache@v4
        with:
          path: /opt/allure
          key: allure-2.27.0

      # Устанавливает Allure CLI, если он не был найден в кэше.
      # После установки создаёт ссылку /usr/bin/allure, чтобы команда allure была доступна глобально.
      - name: Install Allure CLI
        run: |
          if [ ! -x /opt/allure/bin/allure ]; then
            ALLURE_VERSION=2.27.0
            curl -L -o allure.tgz https://github.com/allure-framework/allure2/releases/download/${ALLURE_VERSION}/allure-${ALLURE_VERSION}.tgz
            tar -xzf allure.tgz
            sudo mv allure-${ALLURE_VERSION} /opt/allure
          fi

          sudo ln -sf /opt/allure/bin/allure /usr/bin/allure
          allure --version

      # Пытается получить ветку allure-history из репозитория.
      # В ней хранится история прошлых Allure-отчётов для графиков и трендов.
      - name: Fetch Allure history branch
        run: git fetch --depth=1 origin allure-history:allure-history || true

      # Восстанавливает старую Allure history и кладёт её в allure-results/history.
      # Благодаря этому новый Allure-отчёт продолжает показывать историю прошлых запусков.
      - name: Restore Allure history
        run: |
          if git show-ref --verify --quiet refs/heads/allure-history; then
            git checkout allure-history -- history || true

            if [ -d "history" ]; then
              mkdir -p allure-results/history
              cp -r history/* allure-results/history/ || true
            fi

            git checkout -- .
          fi

      # Генерирует HTML-отчёт Allure из сырых результатов pytest в allure-results.
      # if: always() нужен, чтобы отчёт создавался даже если тесты упали.
      - name: Generate Allure report
        if: always()
        run: allure generate allure-results -o allure-report --clean

      # Подготавливает GitHub Pages для публикации Allure HTML-отчёта.
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v4

      # Загружает папку allure-report как artifact для GitHub Pages.
      # Именно эта папка потом будет опубликована как сайт.
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: allure-report

      # Публикует Allure HTML-отчёт на GitHub Pages.
      - name: Deploy Allure report to GitHub Pages
        uses: actions/deploy-pages@v4

      # Сохраняет новую папку allure-report/history в отдельную ветку allure-history.
      # Эта ветка нужна, чтобы в следующих запусках Allure показывал историю и тренды.
      - name: Persist Allure history
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git checkout --orphan tmp-history
          git rm -rf . >/dev/null 2>&1 || true

          mkdir history
          cp -r allure-report/history/* history/ || true

          git add history
          git commit -m "Update Allure history" || true
          git branch -M allure-history
          git push -f origin allure-history

      # Возвращает workflow в failed-статус, если тесты реально упали.
      # Это нужно, потому что шаг Run selected test suite использует continue-on-error: true.
      - name: Fail workflow if tests failed
        if: steps.tests.outcome == 'failure'
        run: exit 1