name: API Tests

on:
  workflow_dispatch:
    inputs:
      suite:
        description: "Test suite to run"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - smoke
          - regression
          - negative

      workers:
        description: "xdist workers count"
        required: true
        default: "2"
        type: choice
        options:
          - auto
          - "2"
          - "3"
          - "4"

# Одновременно разрешён только один запуск публикации GitHub Pages.
# Новый workflow дождётся завершения предыдущего.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  run-tests:
    name: Run API tests
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    # Права нужны для публикации Allure-отчёта на GitHub Pages
    # и сохранения истории отчётов в отдельную ветку allure-history.
    permissions:
      contents: write
      pages: write
      id-token: write

    # Секреты из GitHub Secrets передаются в workflow как переменные окружения.
    env:
      BASE_URL: ${{ secrets.BASE_URL }}
      API_TOKEN: ${{ secrets.API_TOKEN }}

    steps:
      # Скачивает код репозитория внутрь GitHub Actions runner.
      - name: Checkout repository
        uses: actions/checkout@v7

      # Собирает Docker-образ по Dockerfile и docker-compose.yml.
      - name: Build Docker image
        run: docker compose build

      # Запускает выбранный test suite: all, smoke, regression или negative.
      # continue-on-error нужен, чтобы workflow сохранил логи и создал Allure-отчёт
      # даже при падении тестов.
      - name: Run selected test suite
        id: tests
        continue-on-error: true
        run: docker compose run --rm -e PYTEST_WORKERS=${{ github.event.inputs.workers }} ${{ github.event.inputs.suite }}

      # Исправляет права на файлы, созданные внутри Docker-контейнера.
      - name: Fix artifact permissions
        if: always()
        run: sudo chown -R $USER:$USER allure-results logs || true

      # Добавляет в Allure информацию о GitHub Actions и окружении запуска.
      - name: Add Allure metadata
        if: always()
        run: |
          mkdir -p allure-results

          cat > allure-results/executor.json <<EOF
          {
            "reportName": "API Tests: ${{ github.event.inputs.suite }}",
            "buildOrder": ${{ github.run_number }},
            "name": "GitHub Actions",
            "type": "github",
            "buildName": "Run #${{ github.run_number }} (${{ github.event.inputs.suite }})",
            "buildUrl": "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          }
          EOF

          cat > allure-results/environment.properties <<EOF
          Test_suite=${{ github.event.inputs.suite }}
          Workers=${{ github.event.inputs.workers }}
          Runner_OS=${{ runner.os }}
          CI=GitHub Actions
          Docker=true
          EOF

      # Загружает pytest-логи как artifact.
      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-logs
          path: logs/
          if-no-files-found: warn
          retention-days: 14

      # Устанавливает Java, потому что Allure CLI работает через Java.
      - name: Install Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # Кэширует Allure CLI в /opt/allure.
      - name: Cache Allure CLI
        uses: actions/cache@v6
        with:
          path: /opt/allure
          key: allure-2.27.0

      # Устанавливает Allure CLI, если он не был найден в кэше.
      - name: Install Allure CLI
        run: |
          if [ ! -x /opt/allure/bin/allure ]; then
            ALLURE_VERSION=2.27.0
            curl -L -o allure.tgz https://github.com/allure-framework/allure2/releases/download/${ALLURE_VERSION}/allure-${ALLURE_VERSION}.tgz
            tar -xzf allure.tgz
            sudo mv allure-${ALLURE_VERSION} /opt/allure
          fi

          sudo ln -sf /opt/allure/bin/allure /usr/bin/allure
          allure --version

      # Пытается получить ветку allure-history из репозитория.
      - name: Fetch Allure history branch
        run: git fetch --depth=1 origin allure-history:allure-history || true

      # Восстанавливает историю предыдущих запусков.
      - name: Restore Allure history
        run: |
          if git show-ref --verify --quiet refs/heads/allure-history; then
            git checkout allure-history -- history || true

            if [ -d "history" ]; then
              mkdir -p allure-results/history
              cp -r history/* allure-results/history/ || true
            fi

            git checkout -- .
          fi

      # Обычный отчёт формирует историю, а цельный single-file отчёт
      # публикуется на GitHub Pages без смешивания файлов разных запусков.
      - name: Generate Allure reports
        if: always()
        run: |
          allure generate allure-results -o allure-report-history --clean
          allure generate allure-results -o allure-report --clean --single-file

      # Подготавливает GitHub Pages.
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      # Загружает цельный Allure-отчёт как GitHub Pages artifact.
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: allure-report

      # Публикует Allure-отчёт на GitHub Pages.
      - name: Deploy Allure report to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      # Сохраняет историю Allure в отдельную ветку allure-history.
      - name: Persist Allure history
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git checkout --orphan tmp-history
          git rm -rf . >/dev/null 2>&1 || true

          mkdir history
          cp -r allure-report-history/history/* history/ || true

          git add history
          git commit -m "Update Allure history" || true
          git branch -M allure-history
          git push -f origin allure-history

      # Возвращает workflow в failed-статус, если тесты упали.
      - name: Fail workflow if tests failed
        if: steps.tests.outcome == 'failure'
        run: exit 1
