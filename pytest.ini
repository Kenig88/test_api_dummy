[pytest]
# Где pytest будет искать тесты
testpaths = tests

# Добавляем корень проекта в PYTHONPATH,
# чтобы импорты типа "from services..." работали без установки пакета
pythonpath = .

# Опции, которые будут применяться к каждому запуску pytest по умолчанию
addopts =
    -ra
    --tb=short
    --strict-markers
    -v

# Описание маркеров
markers =
    smoke: critical smoke tests
    regression: full regression suite
    negative: negative/error handling tests

# Логи НЕ выводим в терминал, чтобы pytest output не был шумным
log_cli = false

# Fallback-путь для логов.
# В conftest.py он переопределяется на:
# logs/api-tests-main.log
# logs/api-tests-gw0.log
# logs/api-tests-gw1.log
log_file = logs/pytest.log

# В файл пишем INFO, чтобы видеть тесты и API-запросы,
# но не засорять лог DEBUG-сообщениями библиотек
log_file_level = INFO
log_file_format = %(asctime)s %(levelname)s [%(name)s] %(message)s
log_file_date_format = %Y-%m-%d %H:%M:%S